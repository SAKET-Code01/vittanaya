<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/vittanaya-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VITTANAYA — AI-Driven Hyper-Local Business Advisory and Financial Structuring Assistant (SIH26091)" />
    <title>VITTANAYA — New Business Idea Intake • Hyper-Local Feasibility</title>
    <script>
      // Restore saved VITTANAYA theme before first paint to prevent flash.
      (function () {
        try {
          var t = localStorage.getItem('vittanaya-theme');
          if (!t) t = 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(t);
          root.setAttribute('data-theme', t);
          root.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#F8FAFC] text-slate-900 font-sans antialiased selection:bg-emerald-500/20 selection:text-emerald-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
